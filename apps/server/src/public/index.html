<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operit-like · 测试台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 12px; color: #7dd3fc; }
  .card { background: #232343; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3a3a5e; background: #1f1f3a; color: #eee; margin-bottom: 8px; font-size: 15px; }
  textarea { min-height: 52px; resize: vertical; }
  button { padding: 10px 18px; border-radius: 8px; border: none; background: #4f46e5; color: #fff; font-size: 15px; cursor: pointer; }
  button.secondary { background: #2d2d55; }
  button.pink { background: #db2777; }
  #authBox { display: block; }
  #appBox { display: none; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  #convList, #charList { max-height: 140px; overflow-y: auto; margin-bottom: 8px; }
  .item { padding: 8px 10px; border-radius: 8px; background: #2a2a4e; margin-bottom: 4px; cursor: pointer; font-size: 14px; display:flex; justify-content:space-between; }
  .item.active { background: #4f46e5; }
  .item .del { color:#f87171; margin-left:8px; }
  #chatBox { height: 300px; overflow-y: auto; border: 1px solid #3a3a5e; border-radius: 8px; padding: 12px; margin-bottom: 8px; background: #1b1b33; }
  .msg { margin-bottom: 8px; }
  .msg .who { font-size: 12px; color: #8b8bb3; }
  .msg.user .bubble { background: #4f46e5; }
  .msg.assistant .bubble { background: #2d2d55; }
  .msg.assistant .who { color: #db2777; }
  .bubble { display: inline-block; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .status { font-size: 12px; color: #7dd3fc; min-height: 16px; margin-bottom: 8px; }
  .tip { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  .section-title { font-size: 14px; color:#f0abfc; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ Operit-like 测试台</h1>
  <div id="authBox" class="card">
    <div class="row">
      <input id="username" placeholder="用户名" value="tester">
      <input id="password" type="password" placeholder="密码" value="test1234">
    </div>
    <button onclick="register()">注册</button>
    <button class="secondary" onclick="login()">登录</button>
    <div class="status" id="authStatus"></div>
    <div class="tip">点登录用测试账号（tester/test1234），或注册新账号</div>
  </div>
  <div id="appBox">
    <div class="card">
      <div class="section-title">💗 我的角色卡（虚拟恋人）</div>
      <div id="charList"></div>
      <div class="row">
        <input id="charName" placeholder="角色名，如：小雅">
        <input id="charPersona" placeholder="性格，如：温柔可爱、爱撒娇">
      </div>
      <input id="charDesc" placeholder="角色设定：18岁少女，我的青梅竹马…">
      <button class="pink" onclick="createChar()">+ 创建角色卡</button>
      <div class="tip">创建后点下方会话里的角色名即可绑定</div>
    </div>
    <div class="card">
      <div class="section-title">💬 会话</div>
      <div class="row">
        <input id="convTitle" placeholder="会话标题" value="我的聊天">
        <button onclick="createConv()">新建</button>
      </div>
      <div id="convList"></div>
    </div>
    <div class="card">
      <div id="chatBox"></div>
      <div class="status" id="chatStatus"></div>
      <div class="row"><input id="input" placeholder="输入消息…"><button onclick="send()">发送</button></div>
    </div>
  </div>
</div>
<script>
const API = '';
let TOKEN = localStorage.getItem('token') || '';
let CID = localStorage.getItem('cid') || '';
let streaming = false;
let chars = [];
const $ = id => document.getElementById(id);
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API + path, { ...opts, headers });
  return res.json();
}
function setStatus(el, txt) { $(el).textContent = txt; }
async function register() {
  const r = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ username: $('username').value, password: $('password').value }) });
  if (r.token) { TOKEN = r.token; localStorage.setItem('token', TOKEN); enterApp(); }
  else setStatus('authStatus', '注册失败: ' + (r.message || '可能已存在，试试登录'));
}
async function login() {
  const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: $('username').value, password: $('password').value }) });
  if (r.token) { TOKEN = r.token; localStorage.setItem('token', TOKEN); enterApp(); }
  else setStatus('authStatus', '登录失败: ' + (r.message || JSON.stringify(r)));
}
async function enterApp() {
  $('authBox').style.display = 'none';
  $('appBox').style.display = 'block';
  await loadChars();
  await loadConvs();
}
async function loadChars() {
  chars = await api('/api/characters');
  $('charList').innerHTML = '';
  for (const c of chars) {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<span>💗 ' + c.name + '</span>';
    d.onclick = () => { $('charName').value = c.name; $('charPersona').value = c.personality; $('charDesc').value = c.description; };
    $('charList').appendChild(d);
  }
}
async function createChar() {
  const r = await api('/api/characters', { method: 'POST', body: JSON.stringify({
    name: $('charName').value, personality: $('charPersona').value, description: $('charDesc').value,
    systemPrompt: 'You are ' + $('charName').value + '. Stay in character. Reply with short human-like sentences.',
  }) });
  if (r.id) { await loadChars(); setStatus('chatStatus', '角色「' + r.name + '」已创建'); }
}
async function loadConvs() {
  const convs = await api('/api/conversations');
  $('convList').innerHTML = '';
  for (const c of convs) {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === CID ? ' active' : '');
    const charName = c.characterCardId ? (chars.find(x => x.id === c.characterCardId)?.name || '') : '';
    d.innerHTML = '<span>' + c.title + (charName ? ' <span style="color:#f0abfc">· ' + charName + '</span>' : '') + '</span>';
    d.onclick = () => selectConv(c.id);
    $('convList').appendChild(d);
  }
  if (!CID && convs.length) CID = convs[0].id;
  localStorage.setItem('cid', CID);
  if (CID) await loadMessages(CID);
}
async function createConv() {
  const charId = chars.length ? (prompt('绑定角色卡 ID？留空则不绑定（可复制上方创建的角色）') || '') : '';
  const r = await api('/api/conversations', { method: 'POST', body: JSON.stringify({ title: $('convTitle').value, characterCardId: charId || undefined }) });
  CID = r.id; localStorage.setItem('cid', CID);
  await loadConvs();
}
async function selectConv(id) { CID = id; localStorage.setItem('cid', CID); await loadConvs(); }
async function loadMessages(cid) {
  const msgs = await api('/api/conversations/' + cid + '/messages');
  $('chatBox').innerHTML = '';
  for (const m of msgs) appendMsg(m.role, m.content, '');
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}
function appendMsg(role, text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="who">' + (role === 'user' ? '你' : (who || 'AI')) + '</div><div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  $('chatBox').appendChild(div);
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}
async function send() {
  const text = $('input').value.trim();
  if (!text || streaming || !CID) return;
  $('input').value = '';
  appendMsg('user', text, '');
  streaming = true;
  setStatus('chatStatus', '正在输入…');
  const bubbleDiv = document.createElement('div');
  bubbleDiv.className = 'msg assistant';
  bubbleDiv.innerHTML = '<div class="who">…</div><div class="bubble"></div>';
  $('chatBox').appendChild(bubbleDiv);
  const bubble = bubbleDiv.querySelector('.bubble');
  const who = bubbleDiv.querySelector('.who');
  const res = await fetch(API + '/api/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: JSON.stringify({ conversationId: CID, content: text }),
  });
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  let segAccum = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop() || '';
    for (const p of parts) {
      const line = p.trim();
      if (!line.startsWith('data:')) continue;
      try {
        const ev = JSON.parse(line.slice(5).trim());
        if (ev.type === 'meta' && ev.character) who.textContent = ev.character;
        if (ev.type === 'token') { bubble.textContent += ev.delta; }
        if (ev.type === 'segment') { segAccum += ev.text; bubble.textContent = segAccum; }
        if (ev.type === 'done') setStatus('chatStatus', '完成 ✓');
        if (ev.type === 'error') { setStatus('chatStatus', '错误: ' + ev.message); streaming = false; }
      } catch {}
    }
    $('chatBox').scrollTop = $('chatBox').scrollHeight;
  }
  streaming = false;
}
window.onload = () => { if (TOKEN) enterApp(); };
</script>
</body>
</html>
